<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Hangul — Nguyên âm & Phụ âm tiếng Hàn</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <button id="btn-home" class="brand" title="Về trang chủ">
      <span class="brand-mark">한</span>
      <span class="brand-text">Học Hangul</span>
    </button>
    <div id="header-progress" class="header-progress" hidden>
      <div class="header-progress-bar"><div id="header-progress-fill" class="header-progress-fill"></div></div>
      <span id="header-progress-label"></span>
    </div>
    <button id="btn-settings" class="settings-btn" title="Cài đặt tốc độ đọc">⚙</button>
  </div>
  <div id="settings-panel" class="settings-panel" hidden>
    <h4>🔊 Tốc độ đọc</h4>
    <div class="settings-row">
      <input type="range" id="speech-rate-slider" min="0.3" max="1.1" step="0.05">
      <span id="speech-rate-value"></span>
    </div>
    <button class="btn btn-primary btn-block" id="btn-speed-test">Nghe thử: 안녕하세요</button>
  </div>
</header>

<nav class="tab-bar">
  <button class="tab-btn" id="tab-hangul">📖 Học Hangul</button>
  <button class="tab-btn" id="tab-vocab">💬 Từ vựng đời sống</button>
</nav>

<main id="app" class="app-main"></main>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="data.js"></script>
<script src="vocab-data.js"></script>
<script src="app.js"></script>
</body>
</html>
